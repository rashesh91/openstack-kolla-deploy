# Nova configuration overlay for Kolla-Ansible
# Author: rasheshpatel <rasheshkumar.patel@gmail.com>
#
# This file is placed at /etc/kolla/config/nova/nova.conf on the deploy node.
# Kolla-Ansible merges it with the auto-generated nova.conf inside the container.
# Only settings that differ from Kolla defaults need to be specified here.

[DEFAULT]
# ---------------------------------------------------------------------------
# Over-commit ratios
# ---------------------------------------------------------------------------
# Reserve 2 GB of host RAM for the OS/hypervisor; never assign it to VMs
reserved_host_memory_mb = 2048

# CPU over-commit ratio: 4 vCPU per physical core (suitable for mixed workloads)
# Set to 1.0 for AI/ML or latency-sensitive workloads
cpu_allocation_ratio = 4.0

# RAM over-commit ratio: 1.0 = no over-commit (conservative; recommended for prod)
ram_allocation_ratio = 1.0

# Disk over-commit ratio: 1.5 allows thin-provisioned ephemeral disks
disk_allocation_ratio = 1.5

# ---------------------------------------------------------------------------
# Instance behaviour
# ---------------------------------------------------------------------------
# Allow resize to the same host (useful in small clusters during testing)
allow_resize_to_same_host = true

# Resume VMs that were running when the host was rebooted
resume_guests_state_on_host_boot = true

# Default availability zone for instances that do not specify one
default_schedule_zone = nova

# Maximum number of block device maps per instance
max_local_block_devices = 3

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dir = /var/log/kolla/nova
debug = False

[scheduler]
# ---------------------------------------------------------------------------
# Scheduler configuration
# ---------------------------------------------------------------------------
# How often (seconds) the scheduler probes nova-compute for new hosts/cells
discover_hosts_in_cells_interval = 300

# Maximum scheduling attempts before returning a NoValidHost error
max_attempts = 5

# Number of scheduler workers — set equal to vCPU count of the control node
workers = 4

[filter_scheduler]
# ---------------------------------------------------------------------------
# Filter scheduler
# ---------------------------------------------------------------------------
# Enabled filters (order matters — filters run left-to-right)
enabled_filters = ComputeFilter,ComputeCapabilitiesFilter,ImagePropertiesFilter,ServerGroupAntiAffinityFilter,ServerGroupAffinityFilter,SameHostFilter,DifferentHostFilter

# Weigher classes — use all built-in weighers
weight_classes = nova.scheduler.weights.all_weighers

# Weigher multipliers
# Positive = prefer hosts with more RAM/CPU free; negative = prefer packing
ram_weight_multiplier = 1.0
cpu_weight_multiplier = 1.0

# Soft affinity/anti-affinity weigher multipliers
soft_affinity_weight_multiplier = 1.0
soft_anti_affinity_weight_multiplier = 1.0

# Subsection of hosts considered per scheduling request (reduces lock contention)
host_subset_size = 3

[libvirt]
# ---------------------------------------------------------------------------
# Libvirt / KVM configuration
# ---------------------------------------------------------------------------
virt_type = kvm

# Live migration transport: ssh (recommended for security)
live_migration_scheme = ssh
live_migration_uri = qemu+ssh://nova@%s/system

# CPU mode: host-passthrough exposes all host CPU features to VMs
# Use host-model for cross-hypervisor live migration compatibility
cpu_mode = host-passthrough

# Disk cache mode for RBD (network) volumes
disk_cachemodes = network=writeback

# Store ephemeral disks in Ceph RBD instead of local storage
images_type = rbd
images_rbd_pool = vms
images_rbd_ceph_conf = /etc/ceph/ceph.conf
rbd_user = nova

# UUID of the libvirt secret that holds the Ceph client keyring
# Generate with: uuidgen; then set in /etc/nova/secret.xml on each compute node
rbd_secret_uuid = PUT_LIBVIRT_SECRET_UUID_HERE

# Live migration downtime settings (milliseconds)
# Allow up to 500ms downtime at the end of migration
live_migration_downtime = 500
live_migration_downtime_steps = 10
live_migration_downtime_delay = 75

# Memory page dirtying threshold (pages/second) that triggers migration completion
live_migration_bandwidth = 0

# Timeout (seconds) to wait for live migration progress
live_migration_progress_timeout = 150

# Maximum time (seconds) to complete a live migration
live_migration_completion_timeout = 800

# Number of retries for failed live migrations
live_migration_retry_count = 3

[vnc]
# ---------------------------------------------------------------------------
# VNC / noVNC console
# ---------------------------------------------------------------------------
enabled = true

# nova-novncproxy listens on all interfaces
server_listen = 0.0.0.0

# Address advertised to the noVNC proxy for inbound VM connections
server_proxyclient_address = $my_ip

# URL that browsers connect to (must be externally reachable)
novncproxy_base_url = http://10.0.1.100:6080/vnc_lite.html

[placement]
# ---------------------------------------------------------------------------
# Placement API connection
# ---------------------------------------------------------------------------
auth_type = password
auth_url = http://10.0.1.100:5000/v3
username = placement
user_domain_name = Default
project_name = service
project_domain_name = Default

[oslo_messaging_rabbit]
# ---------------------------------------------------------------------------
# RabbitMQ HA settings
# ---------------------------------------------------------------------------
# Heartbeat timeout — increase if controller nodes have high CPU load
heartbeat_timeout_threshold = 60

# Number of heartbeats per second
heartbeat_rate = 2

# Run heartbeat in a separate POSIX thread (avoids GIL blocking)
heartbeat_in_pthread = true

# Retry interval in seconds when the RabbitMQ connection drops
rabbit_retry_interval = 1

# Maximum retry interval
rabbit_retry_backoff = 2

# Total retries before giving up (-1 = retry indefinitely)
rabbit_max_retries = 0

[upgrade_levels]
# ---------------------------------------------------------------------------
# Rolling upgrade compatibility
# ---------------------------------------------------------------------------
# "auto" allows older and newer nova-compute versions to co-exist during upgrades
compute = auto

[oslo_concurrency]
# ---------------------------------------------------------------------------
# Locking
# ---------------------------------------------------------------------------
lock_path = /var/lib/nova/tmp

[cache]
# ---------------------------------------------------------------------------
# Memcached caching (improves scheduler performance under high load)
# ---------------------------------------------------------------------------
enabled = true
backend = oslo_cache.memcache_pool
memcache_servers = 10.0.1.11:11211,10.0.1.12:11211,10.0.1.13:11211
