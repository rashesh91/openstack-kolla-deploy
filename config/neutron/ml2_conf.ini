# Neutron ML2 plugin configuration overlay for Kolla-Ansible
# Author: rasheshpatel <rasheshkumar.patel@gmail.com>
#
# Place at /etc/kolla/config/neutron/ml2_conf.ini on the deploy node.
# Kolla merges this with its generated ml2_conf.ini inside the container.

[ml2]
# ---------------------------------------------------------------------------
# ML2 type and mechanism drivers
# ---------------------------------------------------------------------------
# Supported tenant and provider network types
type_drivers = flat,vlan,vxlan

# Default type for new tenant/project networks
tenant_network_types = vxlan

# Mechanism drivers:
#   openvswitch  — OVS-based data plane
#   l2population — optimises ARP/BUM flooding using ML2 L2 population driver
mechanism_drivers = openvswitch,l2population

# Extension drivers:
#   port_security — enables security groups and anti-spoofing rules per port
#   qos           — enables bandwidth limiting and DSCP marking on ports
extension_drivers = port_security,qos

# MTU of the physical network. For jumbo frames set to 9000 and adjust
# vxlan overhead: tunnel MTU = path_mtu - 50 (VXLAN header overhead)
path_mtu = 1500

[ml2_type_flat]
# ---------------------------------------------------------------------------
# Flat (provider) networks
# ---------------------------------------------------------------------------
# physnet1 maps to the physical network on eno2 (br-ex OVS bridge)
# Use * to allow flat networks on any physical network
flat_networks = physnet1

[ml2_type_vlan]
# ---------------------------------------------------------------------------
# VLAN provider/tenant networks
# ---------------------------------------------------------------------------
# Syntax: <physical_network>:<vlan_min>:<vlan_max>
# VLANs 100-200 on physnet1 are available for tenant or provider networks
network_vlan_ranges = physnet1:100:200

[ml2_type_vxlan]
# ---------------------------------------------------------------------------
# VXLAN overlay (tenant networks)
# ---------------------------------------------------------------------------
# VNI range for tenant networks
vni_ranges = 1:65535

# Multicast group for BUM traffic when l2population is disabled
# With l2population enabled this group is not used for unicast VTEP traffic
vxlan_group = 239.1.1.1

[securitygroup]
# ---------------------------------------------------------------------------
# Security groups
# ---------------------------------------------------------------------------
enable_security_group = true

# Use OVS hybrid iptables driver — compatible with OVS without native firewall
# For OVS with native OpenFlow firewall, use:
#   neutron.agent.linux.openvswitch_firewall.OVSFirewallDriver
firewall_driver = neutron.agent.linux.iptables_firewall.OVSHybridIptablesFirewallDriver

[ovs]
# ---------------------------------------------------------------------------
# Open vSwitch settings (applied to neutron-openvswitch-agent)
# ---------------------------------------------------------------------------
# Map physical networks to OVS bridge names
# physnet1 -> br-ex (eno2 must be patched into br-ex on each agent node)
bridge_mappings = physnet1:br-ex

# Tunnel types enabled on this agent
tunnel_types = vxlan

# Local IP for VXLAN tunnel endpoints (VTEP)
# IMPORTANT: In production, replace NODE_TUNNEL_IP with the actual eno3 IP
# of each compute/network node. This is typically templated per host in
# /etc/kolla/config/neutron/<hostname>/ml2_conf.ini
local_ip = NODE_TUNNEL_IP

# Enable L2 population for ARP optimisation
l2_population = true

# ARP responder avoids flooding ARP requests across the overlay
arp_responder = true

# OpenFlow controller connection timeout (seconds)
of_connect_timeout = 60

# Timeout for a single OpenFlow request
of_request_timeout = 30

[agent]
# ---------------------------------------------------------------------------
# Neutron OVS agent runtime settings
# ---------------------------------------------------------------------------
# Tunnel types this agent supports
tunnel_types = vxlan

# UDP port for VXLAN encapsulation (IANA-assigned)
vxlan_udp_port = 4789

# L2 population integration
l2_population = true

# Reply to ARP requests without flooding to remote VTEPs
arp_responder = true

# Block ARP spoofing (prevents IP/MAC spoofing attacks)
prevent_arp_spoofing = true

# Polling interval in seconds for port state changes
polling_interval = 2

# Minimize polling by using kernel events when possible (reduces CPU usage)
minimize_polling = True

# Number of threads for concurrent agent operations
agent_workers = 2

[securitygroup]
# ---------------------------------------------------------------------------
# Repeated here for the agent section (some Neutron versions require it)
# ---------------------------------------------------------------------------
enable_security_group = true
firewall_driver = neutron.agent.linux.iptables_firewall.OVSHybridIptablesFirewallDriver
